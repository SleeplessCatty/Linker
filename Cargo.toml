[workspace]
members = [
    "crates/linker-cli",
    "crates/linker-core",
    "crates/linker-daemon",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
assert_cmd = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
fs2 = "0.4"
libc = "0.2"
notify = "6"
predicates = "3"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-width = "0.2"
walkdir = "2"
